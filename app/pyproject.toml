[project]
name = "situational-awareness-api"
version = "0.1.0"
description = "MongoDB services and FastAPI adapter for Situational Awareness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymongo>=4.9,<5",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
migration = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
